[package]
name = "hanzi-sync"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
# (numbers must come back exactly as they went: the schedules are compared after a round trip)
serde_json = { version = "1", features = ["float_roundtrip"] }
flate2 = "1"
sha2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
getrandom = "0.2"
subtle = "2"
# TLS 1.3 with the ring provider (the one the app's downloads already use; no C toolchain needed)
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }

[[bin]]
name = "hanzi-sync-server"
path = "src/bin/hanzi-sync-server.rs"
