[package]
name = "hanzi-cards"
version = "0.3.2"
description = "Mandarin Chinese flash cards with spaced repetition and a built-in dictionary"
edition = "2021"
license = "MIT"

[lib]
name = "hanzi_cards_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# One running copy at a time: the database (and switching it in Settings) is one copy's alone.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
csv = "1"
ureq = "2"
flate2 = "1"
thiserror = "1"
roxmltree = "0.20"
# Whisper speech recognition (pure Rust, runs on the CPU).
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
# Downloading NVIDIA's GPU libraries (Settings): zip archives with SHA-256 checks.
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
sherpa-onnx = "2.0.1"
tar = "0.4.46"
bzip2 = "0.6.1"

[features]
# Run Whisper on an NVIDIA GPU (needs the CUDA Toolkit to build): cargo build --features gpu
gpu = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

# Spoken answers use the built-in Windows speech recognizer.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Globalization", "Media_SpeechRecognition", "Media_Core", "Media_SpeechSynthesis", "Storage_Streams", "Win32_System_WinRT", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }
windows-collections = "0.3"
windows-future = "0.3"
keyring = { version = "3", features = ["windows-native"] }

# The Claude API key is kept in the system keychain.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# To let the webview use the microphone (spoken answers); the same version Tauri uses.
webkit2gtk = "2.0"

# Dependencies (Whisper maths in particular) are optimised even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true
