[package]
name = "hanzi-cards"
version = "0.1.0"
description = "Mandarin Chinese flash cards with spaced repetition and a built-in dictionary"
edition = "2021"

[lib]
name = "hanzi_cards_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
csv = "1"
ureq = "2"
flate2 = "1"
thiserror = "1"
roxmltree = "0.20"

[profile.release]
codegen-units = 1
lto = true
strip = true
